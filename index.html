<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quran Word Reader</title>
<meta name="description" content="Read the Quran word by word until you understand the Arabic without a translation.">
<meta name="theme-color" content="#1f6f62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="menu" id="menu" aria-controls="side" aria-expanded="false">Sūrahs</button>
  <a class="brand" href="#/">Quran Word Reader</a>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home">Home</a>
    <a href="#/search" data-tab="search">Search</a>
    <a href="#/parts" data-tab="parts">Word parts</a>
    <a href="#/hive" data-tab="hive">Honeycomb</a>
    <a href="#/about" data-tab="about">About</a>
  </nav>
  <div class="jar" title="Honey jar"><i class="drop"></i><strong id="jar">0</strong></div>
</header>
<div class="layout">
  <aside class="side" id="side" aria-label="Sūrahs">
    <div class="side-head">
      <label class="sr" for="filter">Find a sūrah</label>
      <input id="filter" type="search" placeholder="Find a sūrah by name or number" autocomplete="off">
    </div>
    <ol class="surahs" id="surahs"></ol>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main id="app" class="wrap" aria-live="polite"></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
