name: Check data
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data from sources and glosses
        run: python3 tools/build_data.py
      - name: Fail if the committed data is out of date
        run: git diff --exit-code -- data
